<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日付・時刻・カウンター</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: #000;
    color: #fff;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5vh;
  }

  #today {
    font-size: 10vw;
  }

  #now {
    font-size: 8vw;
  }

  .counter-display {
    font-size: 10vw;
  }

  .button-row {
    display: flex;
    gap: 5vw;
    margin-top: 2vh;
  }

  button {
    font-size: 8vw;
    padding: 2vw 4vw;
  }

  input[type="number"] {
    width: 40vw;
    font-size: 20vw;
    text-align: right;
    border: none;
    background: none;
    color: #fff;
    -moz-appearance: textfield;
  }

  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  span {
    font-size: 10vw;
  }
</style>
</head>
<body>

<div class="container">
  <div id="today"></div>
  <div id="now"></div>

  <div class="counter-display">
    <input id="counter" type="number" value="0" />
    <span>日目</span>
  </div>

<!--ボタン削除
  <div class="button-row">
    <button id="minus">-</button>
    <button id="plus">+</button>
  </div>
-->
</div>

<script>
  function updateDate() {
    const now = new Date();
    const w = ['日','月','火','水','木','金','土'];
    const y = now.getFullYear();
    const m = now.getMonth() + 1;
    const d = now.getDate();
    const day = w[now.getDay()];
    document.getElementById('today').textContent = `${y}/${m}/${d}(${day})`;
  }

  function updateTime() {
    const now = new Date();
    const h = String(now.getHours()); 
    const min = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('now').textContent = `${h}:${min}`;
  }

  // 初期表示
  updateDate();
  updateTime();
  setInterval(updateTime, 10000); // 10秒ごとに時刻更新

  // カウンター操作
  const counter = document.getElementById('counter');
<!--
  document.getElementById('plus').onclick = () => {
    counter.value = String(Number(counter.value) + 1);
  };
  document.getElementById('minus').onclick = () => {
    counter.value = String(Math.max(0, Number(counter.value) - 1));
  };
-->
</script>

</body>
</html>
